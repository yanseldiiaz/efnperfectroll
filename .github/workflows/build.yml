name: Build efnperfectroll

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Locate files
        id: files
        run: |
          JAR=$(ls build/libs/efnperfectroll-*.jar | grep -v -E 'sources|slim' | head -1)
          EF=$(find ~/.gradle -name 'epic-fight-mod-405076-8049910*.jar' | grep -v -i -E 'deobf|mapped|sources' | head -1)
          if [ -z "$EF" ]; then EF=$(find ~/.gradle -name 'epic-fight-mod-405076-8049910*.jar' | head -1); fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "ef=$EF" >> "$GITHUB_OUTPUT"
          echo "Mod jar: $JAR"
          echo "Epic Fight jar: $EF"
          test -n "$JAR" && test -n "$EF"

      - name: Static verification (annotations, descriptors, no Mixin)
        run: python3 scripts/verify_jar.py --jar "${{ steps.files.outputs.jar }}" --epicfight "${{ steps.files.outputs.ef }}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: efnperfectroll-jar
          path: ${{ steps.files.outputs.jar }}
          if-no-files-found: error

      - name: Publish release (only when a tag v* is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.files.outputs.jar }}
